<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seriald 串口设备管理</title>
<!-- 终端模拟器:本地托管,内网不依赖公网 CDN。
     串口/SSH 上跑 vim、htop、menuconfig 这类全屏程序时会用光标定位重画屏幕,
     必须由真正的 VT 模拟器渲染,不能"剥掉 ANSI 再线性追加"(那样会糊成一团)。 -->
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>seriald</h1>
    <span class="mono" style="color:var(--ink-3);font-size:12px">串口设备管理</span>
    <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">连接中…</span></span>
  </div>
  <p class="sub">开发板工作台 · 按标签访问，以序列号保存设备档案、终端记录与 agent 操作历史。</p>
  <div class="overview">
    <div><strong id="count-online">0</strong><span>在线设备</span></div>
    <div><strong id="count-history">0</strong><span>历史设备</span></div>
    <div><strong id="count-pending">0</strong><span>待识别串口</span></div>
  </div>
  <div class="toolbar">
    <input id="device-search" placeholder="搜索标签、序列号、主机名或串口位置" aria-label="搜索设备">
    <select id="device-filter" aria-label="设备状态"><option value="all">全部设备</option><option value="online">在线</option><option value="offline">历史 / 离线</option><option value="pending">待识别</option></select>
  </div>

  <div class="workspace" id="workspace">
  <div class="grid" id="grid"><p class="empty">正在扫描串口…</p></div>

  <div class="detail" id="detail" hidden>
    <div class="hd">
      <span class="nm" id="d-name">—</span>
      <span class="k" id="d-dev">—</span>
      <span class="k" id="d-key">—</span>
      <span class="sp">
        <button id="b-identify" type="button" title="自动登录并读取板子序列号 / IP / sshd">识别设备</button>
        <button id="b-rescue" type="button" title="关闭 autosuspend，并检查采集是否恢复">自愈串口</button>
        <button id="b-rebind" type="button" title="重新绑定 USB 串口，会暂时中断该设备连接" hidden>重新绑定串口</button>
        <button id="b-switch" type="button" title="在同一串口位置更换开发板前点击；旧身份立即离线，新日志先进入待识别目录">准备换板</button>
        <button id="b-rename" type="button">改标签</button>
        <button id="b-close" type="button">收起</button>
      </span>
    </div>
    <div class="tabs" id="d-tabs"></div>
    <div class="info" id="d-info" hidden></div>
    <div class="termhost" id="d-term"></div>
    <div class="sendrow">
      <label class="chk"><input type="checkbox" id="d-kbd" checked> 键盘直通</label>
      <input type="text" id="d-in" placeholder="或在此整行输入后回车" autocomplete="off" spellcheck="false">
      <button class="pri" id="b-send" type="button">发送</button>
      <button id="b-cr" type="button" title="只发一个回车（唤醒板子 / 看是否还活着）">↵</button>
      <button id="b-ctrlc" type="button" title="发送 Ctrl-C">Ctrl-C</button>
      <button id="b-paste" type="button" title="粘贴剪贴板内容到会话">粘贴</button>
      <button id="b-takeover" type="button" hidden title="允许从网页向当前 agent SSH shell 输入，并记录介入事件">介入此会话</button>
    </div>
    <div class="hint">
      勾选「键盘直通」后，点击终端即可输入。agent 会话和归档日志以只读方式查看。<br>
      <b>复制</b>：鼠标拖选后自动复制；<b>粘贴</b>：<span class="mono">Ctrl+V</span> 或点「粘贴」。
      <span class="mono">Ctrl+C</span> 会中断板子上的当前命令。<span id="d-status"></span>
    </div>
    <div class="hint" id="d-hint" hidden></div>
    <section class="records">
      <div class="section-head"><h2>SSH 会话记录</h2><span>在线会话可实时查看，关闭后 transcript 仍保留</span></div>
      <div id="d-activity" class="activity"></div>
      <div class="pager"><button id="activity-prev" type="button">较新</button><span id="activity-page"></span><button id="activity-next" type="button">更早</button></div>
      <div class="section-head"><h2>关键操作记录</h2><span>逐按键写入保留在审计库中，此处不重复显示</span></div>
      <div id="d-events" class="activity"></div>
      <div class="pager"><button id="event-prev" type="button">较新</button><span id="event-page"></span><button id="event-next" type="button">更早</button></div>
      <div class="section-head"><h2>串口日志归档</h2><span id="log-location"></span></div>
      <div class="logs" id="d-logs"></div>
    </section>
  </div>

  </div>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="/static/ui-common.js"></script>
<script src="/static/terminal-policy.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
