name: Windows packages
on:
  workflow_call:
    secrets:
      COMPONENTS_WINDOWS_AMD64_URL:
        required: false
      COMPONENTS_WINDOWS_AMD64_SHA256:
        required: false
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'decklab_windows.py'
      - 'decklab_demo.py'
      - 'decklab_core/**'
      - 'decklabctl.py'
      - 'decklab_mcp.py'
      - 'requirements-mcp.txt'
      - 'pyproject.toml'
      - 'static/**'
      - 'vendor/**'
      - 'index.html'
      - 'requirements-windows.txt'
      - 'tests/**'
      - 'skills/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'tools/*windows*.ps1'
      - 'tools/windows_frozen_inputs.py'
      - 'tools/run_windows_regressions.py'
      - 'packaging/windows-upgrade-mode.ps1'
      - 'tools/install_inno_build_tool.ps1'
      - 'tools/package_docs.py'
      - 'tools/collect_windows_notices.py'
      - 'tools/prepare_windows_build.py'
      - 'tools/prepare_terminal_runtime.py'
      - 'tools/prepare_terminal_assets.py'
      - 'tools/check_public_docs.py'
      - 'tools/test_windows_mcp.py'
      - 'tools/bundle_manifest.py'
      - 'tools/install_components.py'
      - 'tools/fetch_install_components.py'
      - 'tools/windows-launchers/**'
      - 'packaging/decklab-windows.iss'
      - 'packaging/decklab.ico'
      - 'packaging/inno-languages/**'
      - 'packaging/third-party/**'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  regression:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-windows.txt
      - run: .\tools\test_windows_regressions.ps1
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: python tools/check_release_tag.py $env:GITHUB_REF_NAME
      - name: Install installer compiler
        shell: pwsh
        run: .\tools\install_inno_build_tool.ps1
      - name: Prepare reviewed complete-install inputs
        env:
          DECKLAB_COMPONENTS_URL: ${{ vars.COMPONENTS_WINDOWS_AMD64_URL || secrets.COMPONENTS_WINDOWS_AMD64_URL || 'https://github.com/qianqiu-2020/decklab/releases/download/components-1.14.0/decklab-components-1.14.0-windows-amd64.zip' }}
          DECKLAB_COMPONENTS_SHA256: ${{ vars.COMPONENTS_WINDOWS_AMD64_SHA256 || secrets.COMPONENTS_WINDOWS_AMD64_SHA256 || '41389f7c9b17a1a0054b154aad27fc183f0454cd7fd289b410d27e16cf5ad08d' }}
        run: python tools/fetch_install_components.py --platform windows-amd64
      - name: Build Windows installer
        shell: pwsh
        # Exercise the replacement-source path with the reviewed upstream archive.
        run: |
          $arguments = @('-ExecutionPolicy','Bypass','-File','.\tools\build_windows.ps1','-LocalFast','-DesktopRuntime','.\build\install-components\windows-amd64\desktop-runtime','-ParamikoSource','.\packaging\third-party\paramiko-4.0.0\paramiko-4.0.0.tar.gz')
          & powershell @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed.' }
      - name: Smoke test staged Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/decklab/data | Out-Null
          Set-Content -Path dist/decklab/data/ui-language.txt -Value 'en' -Encoding ascii
          $process = Start-Process -FilePath (Resolve-Path dist/decklab/decklab.exe) -ArgumentList '--no-browser','--port','18898' -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod http://127.0.0.1:18898/healthz -TimeoutSec 2
                if ($response.ok) { $healthy = $true; break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if ($healthy -and $response.version -ne (Get-Content -Raw dist/decklab/package-version.txt).Trim()) { throw 'Staged host version differs from the installer version.' }
            if (-not $healthy) { throw 'Staged host did not serve /healthz' }
            $response = Invoke-RestMethod http://127.0.0.1:18898/api/devices -TimeoutSec 5
            if ($response.PSObject.Properties.Name -notcontains 'devices') { throw 'Collector API unavailable' }
            $access = Invoke-RestMethod http://127.0.0.1:18898/api/access -TimeoutSec 5
            if ($access.default_language -ne 'en') { throw 'Host did not expose the installation UI language.' }
            if (-not $access.mcp_enabled -or $access.mcp_url -ne '/mcp') {
              throw ('Packaged remote MCP worker unavailable: ' + $access.mcp_error)
            }
            & .\build\windows-venv\Scripts\python.exe tools/test_windows_mcp.py --control-url http://127.0.0.1:18898
            if ($LASTEXITCODE -ne 0) { throw 'Packaged same-origin remote MCP protocol failed.' }
            $script = Invoke-WebRequest http://127.0.0.1:18898/static/i18n.js -TimeoutSec 5
            if ($script.StatusCode -ne 200) { throw 'Packaged UI translations unavailable.' }
            $englishSkill = Invoke-WebRequest 'http://127.0.0.1:18898/skills/decklab-board/SKILL.md?lang=en' -TimeoutSec 5
            $chineseSkill = Invoke-WebRequest 'http://127.0.0.1:18898/skills/decklab-board/SKILL.md?lang=zh-CN' -TimeoutSec 5
            if ($englishSkill.Content -notmatch 'development boards' -or $chineseSkill.Content -notmatch '开发板') { throw 'Packaged skill language variants unavailable.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Packaged Web and backend roles over TLS with simulated boards
        shell: pwsh
        run: .\build\windows-venv\Scripts\python.exe tools/test_split_nodes.py --exe dist/decklab/decklab.exe
      - name: Verify install and upgrade preserve runtime data
        shell: pwsh
        run: .\tools\test_windows_installer.ps1
      - name: Smoke test packaged simulated boards
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/decklab/decklab.exe) -ArgumentList 'demo','--port','18899' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod http://127.0.0.1:18899/api/devices -TimeoutSec 2
                if ($response.devices.Count -eq 3) { $ready = $true; break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ready) { throw 'Packaged demo did not expose three simulated boards' }
            $logs = Invoke-RestMethod 'http://127.0.0.1:18899/api/logs?key=demo-k1' -TimeoutSec 5
            if ($logs.boots.Count -ne 2) { throw 'Packaged demo archives unavailable' }
            $screen = Invoke-RestMethod 'http://127.0.0.1:18899/api/session?key=demo-k1&sid=serial&screen=1' -TimeoutSec 5
            if (-not $screen.terminal_state.managed -or -not $screen.terminal_snapshot.data) {
              throw 'Packaged Node parser/screen snapshot is unavailable'
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decklab-windows
          path: |
            dist/decklab-*-windows-x64-setup.exe
            dist/decklab-*-windows-x64-setup.exe.sha256
            dist/windows-install-verification.json
          compression-level: 0
          if-no-files-found: error
