name: Linux regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package_install:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            archive_hosts: archive.ubuntu.com security.ubuntu.com
          - arch: arm64
            runner: ubuntu-22.04-arm
            archive_hosts: ports.ubuntu.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Ubuntu archive DNS on the temporary runner
        run: python tools/ci_ubuntu_network.py --repair --hosts ${{ matrix.archive_hosts }}
      - name: Freeze the included MCP worker on the native Ubuntu 22.04 baseline
        run: python tools/build_linux_mcp.py --arch '${{ matrix.arch }}' --output 'build/linux-mcp/${{ matrix.arch }}/runtime'
      - name: Build the matching Debian architecture package
        run: python tools/build_deb.py --core-only --runtime 'build/linux-mcp/${{ matrix.arch }}/runtime' --output dist
      - name: Fresh install and public MCP without network on Ubuntu 22.04
        run: python tools/test_deb_container.py --image ubuntu:22.04 --package dist/seriald_*_${{ matrix.arch }}.deb
      - name: Fresh install and public MCP without network on Ubuntu 24.04
        run: python tools/test_deb_container.py --image ubuntu:24.04 --package dist/seriald_*_${{ matrix.arch }}.deb
      - name: Fetch the checksum-pinned published thin package for upgrade acceptance
        run: |
          curl --fail --location --retry 3 https://github.com/qianqiu-2020/decklab/releases/download/v1.7.0/seriald_1.7.0_all.deb --output build/seriald_1.7.0_all.deb
          echo 'b0020684d469cec4db2fa36f5e967f81c860deb236fbdd1d25da4831857cb1a9  build/seriald_1.7.0_all.deb' | sha256sum --check
      - name: Install, upgrade and use public MCP without network or system SDK on Ubuntu 22.04
        run: python tools/test_deb_container.py --image ubuntu:22.04 --package dist/seriald_*_${{ matrix.arch }}.deb --upgrade-from build/seriald_1.7.0_all.deb
      - name: Install, upgrade and use public MCP without network or system SDK on Ubuntu 24.04
        run: python tools/test_deb_container.py --image ubuntu:24.04 --package dist/seriald_*_${{ matrix.arch }}.deb --upgrade-from build/seriald_1.7.0_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: seriald-linux-${{ matrix.arch }}
          path: dist/*.deb
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'pyserial>=3.5,<4' 'paramiko>=3.4,<5'
      - name: Install optional MCP adapter dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Install BusyBox for the ash terminal resize regression
        if: matrix.python == '3.12'
        run: |
          if ! command -v busybox >/dev/null; then
            python tools/ci_ubuntu_network.py --repair
            sudo apt-get update -qq
            sudo apt-get install -y busybox
          fi
          busybox ash -c ':'
          busybox stty --help
      - name: Check UART archives with a non-UTF-8 locale
        env:
          LC_ALL: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
          PYTHONPATH: tests
        run: python -m unittest test_console_visibility test_serial_health
      - run: python -m unittest discover -s tests
      - run: python tools/check_public_docs.py
      - run: node tests/frontend.test.js && node tests/image-store.test.js
      - run: node tests/share.test.js
      - run: node tests/browser-process.test.js
      - run: python -m compileall -q seriald_core serialctl.py seriald_mcp.py seriald.py seriald_demo.py
      - run: bash -n rescue.sh
      - run: git diff --check
      - name: Real browser with hardware-free fixtures
        if: matrix.python == '3.12'
        run: node tools/browser_smoke.js
      - name: Web configuration in an isolated hardware-free host
        if: matrix.python == '3.12'
        run: node tools/settings_smoke.js
      - name: NOR workspace in desktop and mobile browsers without hardware
        if: matrix.python == '3.12'
        run: node tools/browser_nor_workspace.js dist/nor-workspace-browser
      - name: Real browser against the simulated host
        if: matrix.python == '3.12'
        run: node tools/demo_smoke.js
      - name: Shared SSH and serial screens with real Vim on local PTYs
        if: matrix.python == '3.12'
        run: |
          if ! command -v vim >/dev/null; then
            python tools/ci_ubuntu_network.py --repair
            sudo apt-get update -qq
            sudo apt-get install -y vim
          fi
          node tools/shared_terminal_smoke.js
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: browser-smoke
          path: |
            dist/ui-*.png
            dist/demo-ui.png
            dist/nor-workspace-browser/*.png
            dist/nor-workspace-browser/receipt.json
            dist/settings-ui/*.png
          if-no-files-found: ignore
