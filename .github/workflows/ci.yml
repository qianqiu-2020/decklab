name: Linux regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package_install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, upgrade and purge in an isolated Ubuntu container
        run: python tools/test_deb_container.py --image '${{ matrix.image }}'
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'pyserial>=3.5,<4' 'paramiko>=3.4,<5'
      - run: python -m unittest discover -s tests
      - run: python tools/check_public_docs.py
      - run: node tests/frontend.test.js
      - run: node tests/share.test.js
      - run: python -m compileall -q seriald_core serialctl.py seriald.py seriald_demo.py
      - run: bash -n rescue.sh
      - run: git diff --check
      - name: Real browser with hardware-free fixtures
        if: matrix.python == '3.12'
        run: node tools/browser_smoke.js
      - name: Real browser against the simulated host
        if: matrix.python == '3.12'
        run: node tools/demo_smoke.js
      - name: Build Linux package
        if: matrix.python == '3.12'
        run: |
          python tools/build_deb.py
          sha256sum dist/*.deb > dist/linux-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: seriald-linux
          path: |
            dist/*.deb
            dist/linux-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: browser-smoke
          path: |
            dist/ui-*.png
            dist/demo-ui.png
          if-no-files-found: ignore
