name: Linux regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_scan:
    # After-the-fact backstop only: by the time this runs the commits are already
    # public. The real gate is the pre-push hook (tools/install_hooks.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan pushed commits for private addresses, internal hosts and credentials
        env:
          # Optional repository secret with one internal-domain regex per line.
          DECKLAB_PUBLIC_DENY: ${{ secrets.PUBLIC_PUSH_DENY }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD_SHA"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            echo "No previous public commit for this event; scanning $HEAD_SHA only."
            range="$HEAD_SHA^!"
          fi
          python tools/check_public_push.py --redact "$range"
  package_install:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            archive_hosts: archive.ubuntu.com security.ubuntu.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Ubuntu archive DNS on the temporary runner
        run: python tools/ci_ubuntu_network.py --repair --hosts ${{ matrix.archive_hosts }}
      - name: Prepare reviewed complete-install inputs
        env:
          DECKLAB_COMPONENTS_URL: ${{ vars.COMPONENTS_LINUX_AMD64_URL || secrets.COMPONENTS_LINUX_AMD64_URL || 'https://github.com/qianqiu-2020/decklab/releases/download/components-1.14.0/decklab-components-1.14.0-linux-amd64.zip' }}
          DECKLAB_COMPONENTS_SHA256: ${{ vars.COMPONENTS_LINUX_AMD64_SHA256 || secrets.COMPONENTS_LINUX_AMD64_SHA256 || '804be4bc200ddefbc99a614e676ba829670100556d6da405bb3597cfb667127c' }}
        run: python tools/fetch_install_components.py --platform linux-amd64
      - name: Freeze the included MCP worker in the Ubuntu 22.04 build container
        run: python tools/build_linux_mcp.py --arch '${{ matrix.arch }}' --desktop-runtime build/install-components/linux-amd64/desktop-runtime --output 'build/linux-mcp/${{ matrix.arch }}/runtime'
      - name: Build the matching Debian architecture package
        run: python tools/build_deb.py --local-fast --runtime 'build/linux-mcp/${{ matrix.arch }}/runtime' --output dist
      - name: Check fresh installs and upgrades on Ubuntu 22.04 and 24.04 in parallel
        run: |
          curl --fail --location --retry 3 https://github.com/qianqiu-2020/decklab/releases/download/v1.7.0/seriald_1.7.0_all.deb --output build/decklab_1.7.0_all.deb
          echo 'b0020684d469cec4db2fa36f5e967f81c860deb236fbdd1d25da4831857cb1a9  build/decklab_1.7.0_all.deb' | sha256sum --check
          pids=()
          for ubuntu in 22.04 24.04; do
            for mode in fresh upgrade; do
              args=()
              if [[ $mode == upgrade ]]; then args+=(--upgrade-from build/decklab_1.7.0_all.deb); fi
              python tools/test_deb_container.py --image "ubuntu:$ubuntu" --package dist/decklab_*_amd64.deb "${args[@]}" >"build/install-$ubuntu-$mode.log" 2>&1 &
              pids+=("$!")
            done
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          for log in build/install-*.log; do cat "$log"; done
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: decklab-linux-${{ matrix.arch }}
          path: dist/*.deb
          compression-level: 0
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'pyserial>=3.5,<4' 'paramiko>=3.4,<5'
      - name: Install optional MCP adapter dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Install BusyBox for the ash terminal resize regression
        if: matrix.python == '3.12'
        run: |
          if ! command -v busybox >/dev/null; then
            python tools/ci_ubuntu_network.py --repair
            sudo apt-get update -qq
            sudo apt-get install -y busybox
          fi
          busybox ash -c ':'
          busybox stty --help
      - name: Check UART archives with a non-UTF-8 locale
        if: matrix.shard == 0
        env:
          LC_ALL: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
          PYTHONPATH: tests
        run: python -m unittest test_console_visibility test_serial_health
      - name: Backend regression shard
        env:
          PYTHONPATH: tests
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t modules < <(python -c 'from pathlib import Path; import os; print("\n".join([p.stem for p in sorted(Path("tests").glob("test_*.py"))][int(os.environ["TEST_SHARD"])::3]))')
          terminal=()
          remaining=()
          for module in "${modules[@]}"; do
            case "$module" in
              test_console_visibility|test_terminal_backend|test_terminal_state) terminal+=("$module") ;;
              *) remaining+=("$module") ;;
            esac
          done
          if (( ${#terminal[@]} )); then python -m unittest "${terminal[@]}"; fi
          python -m unittest "${remaining[@]}"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'pyserial>=3.5,<4' 'paramiko>=3.4,<5'
      - run: python -m pip install -r requirements-mcp.txt
      - run: python tools/check_public_docs.py
      - run: node tests/frontend.test.js && node tests/image-store.test.js
      - run: node tests/share.test.js && node tests/flashing.test.js && node tests/desktop.test.js
      - run: node tests/browser-process.test.js
      - run: python -m compileall -q decklab_core decklabctl.py decklab_mcp.py decklab.py decklab_demo.py
      - run: bash -n rescue.sh
      - run: git diff --check
      - name: Real browser with hardware-free fixtures
        run: node tools/browser_smoke.js
      - name: Image-store categories in desktop and mobile browsers without hardware
        run: node tests/image-store-browser.test.js
      - name: Native mouse dragging previews device positions without hardware
        run: node tools/browser_device_order.js
      - name: Web configuration in an isolated hardware-free host
        run: node tools/settings_smoke.js
      - name: NOR workspace in desktop and mobile browsers without hardware
        run: node tools/browser_nor_workspace.js dist/nor-workspace-browser
      - name: Real browser against the simulated host
        run: node tools/demo_smoke.js
      - name: Shared SSH and serial screens with real Vim on local PTYs
        run: |
          if ! command -v vim >/dev/null; then
            python tools/ci_ubuntu_network.py --repair
            sudo apt-get update -qq
            sudo apt-get install -y vim
          fi
          node tools/shared_terminal_smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: |
            dist/ui-*.png
            dist/device-drag-browser/*.png
            dist/device-drag-browser/receipt.json
            dist/demo-ui.png
            dist/nor-workspace-browser/*.png
            dist/nor-workspace-browser/receipt.json
            dist/settings-ui/*.png
          if-no-files-found: ignore
