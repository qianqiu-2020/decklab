name: Windows packages
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - 'seriald_windows.py'
      - 'seriald_demo.py'
      - 'seriald_core/**'
      - 'serialctl.py'
      - 'static/**'
      - 'vendor/**'
      - 'index.html'
      - 'requirements-windows.txt'
      - 'tests/**'
      - 'skills/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
      - 'tools/*windows*.ps1'
      - 'tools/install_inno_build_tool.ps1'
      - 'tools/windows-launchers/**'
      - 'packaging/seriald-windows.iss'
      - 'packaging/decklab.ico'
      - 'packaging/inno-languages/**'
      - 'packaging/third-party/**'
      - 'docs/WINDOWS.md'
      - 'docs/DEMO.md'
      - 'docs/CONFIGURATION.md'
      - 'docs/API.md'
      - 'docs/AGENT_ACCESS.md'
      - 'docs/TASKS.md'
      - 'docs/TRANSFER_ARTIFACTS.md'
      - 'docs/HARDWARE_EXTENSIONS.md'
      - 'examples/**'
      - '.github/workflows/windows-portable.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: python tools/check_release_tag.py $env:GITHUB_REF_NAME
      - name: Install installer compiler
        shell: pwsh
        run: .\tools\install_inno_build_tool.ps1
      - name: Build setup EXE and portable ZIP
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\build_windows.ps1
      - name: Smoke test portable host
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/seriald/seriald.exe) -ArgumentList '--no-browser','--port','18898' -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod http://127.0.0.1:18898/healthz -TimeoutSec 2
                if ($response.ok) { $healthy = $true; break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $healthy) { throw 'Portable host did not serve /healthz' }
            $response = Invoke-RestMethod http://127.0.0.1:18898/api/devices -TimeoutSec 5
            if ($response.PSObject.Properties.Name -notcontains 'devices') { throw 'Collector API unavailable' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Verify install and upgrade preserve runtime data
        shell: pwsh
        run: .\tools\test_windows_installer.ps1
      - name: Smoke test packaged simulated boards
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/seriald/seriald.exe) -ArgumentList 'demo','--port','18899' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod http://127.0.0.1:18899/api/devices -TimeoutSec 2
                if ($response.devices.Count -eq 3) { $ready = $true; break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ready) { throw 'Packaged demo did not expose three simulated boards' }
            $logs = Invoke-RestMethod 'http://127.0.0.1:18899/api/logs?key=demo-k1' -TimeoutSec 5
            if ($logs.boots.Count -ne 2) { throw 'Packaged demo archives unavailable' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: seriald-windows
          path: |
            dist/seriald-*-windows-x64-setup.exe
            dist/seriald-*-windows-x64-setup.exe.sha256
            dist/seriald-windows-portable.zip
