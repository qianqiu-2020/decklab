name: Windows packages
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - '.gitattributes'
      - 'seriald_windows.py'
      - 'seriald_demo.py'
      - 'seriald_core/**'
      - 'serialctl.py'
      - 'static/**'
      - 'vendor/**'
      - 'index.html'
      - 'requirements-windows.txt'
      - 'tests/**'
      - 'skills/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'tools/*windows*.ps1'
      - 'tools/install_inno_build_tool.ps1'
      - 'tools/package_docs.py'
      - 'tools/collect_windows_notices.py'
      - 'tools/prepare_windows_build.py'
      - 'tools/prepare_terminal_runtime.py'
      - 'tools/prepare_terminal_assets.py'
      - 'tools/check_public_docs.py'
      - 'tools/bundle_manifest.py'
      - 'tools/windows-launchers/**'
      - 'packaging/seriald-windows.iss'
      - 'packaging/decklab.ico'
      - 'packaging/inno-languages/**'
      - 'packaging/third-party/**'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/windows-portable.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: python tools/check_release_tag.py $env:GITHUB_REF_NAME
      - name: Install installer compiler
        shell: pwsh
        run: .\tools\install_inno_build_tool.ps1
      - name: Build setup EXE and portable ZIP
        shell: pwsh
        # Exercise the replacement-source path with the reviewed upstream archive.
        run: powershell -ExecutionPolicy Bypass -File .\tools\build_windows.ps1 -ParamikoSource .\packaging\third-party\paramiko-4.0.0\paramiko-4.0.0.tar.gz
      - name: Smoke test portable host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/seriald/data | Out-Null
          Set-Content -Path dist/seriald/data/ui-language.txt -Value 'en' -Encoding ascii
          $process = Start-Process -FilePath (Resolve-Path dist/seriald/seriald.exe) -ArgumentList '--no-browser','--port','18898' -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod http://127.0.0.1:18898/healthz -TimeoutSec 2
                if ($response.ok) { $healthy = $true; break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $healthy) { throw 'Portable host did not serve /healthz' }
            $response = Invoke-RestMethod http://127.0.0.1:18898/api/devices -TimeoutSec 5
            if ($response.PSObject.Properties.Name -notcontains 'devices') { throw 'Collector API unavailable' }
            $access = Invoke-RestMethod http://127.0.0.1:18898/api/access -TimeoutSec 5
            if ($access.default_language -ne 'en') { throw 'Host did not expose the installation UI language.' }
            $script = Invoke-WebRequest http://127.0.0.1:18898/static/i18n.js -TimeoutSec 5
            if ($script.StatusCode -ne 200) { throw 'Packaged UI translations unavailable.' }
            $englishSkill = Invoke-WebRequest 'http://127.0.0.1:18898/skills/seriald-board/SKILL.md?lang=en' -TimeoutSec 5
            $chineseSkill = Invoke-WebRequest 'http://127.0.0.1:18898/skills/seriald-board/SKILL.md?lang=zh-CN' -TimeoutSec 5
            if ($englishSkill.Content -notmatch 'development boards' -or $chineseSkill.Content -notmatch '开发板') { throw 'Packaged skill language variants unavailable.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Verify install and upgrade preserve runtime data
        shell: pwsh
        run: .\tools\test_windows_installer.ps1
      - name: Smoke test packaged simulated boards
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/seriald/seriald.exe) -ArgumentList 'demo','--port','18899' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod http://127.0.0.1:18899/api/devices -TimeoutSec 2
                if ($response.devices.Count -eq 3) { $ready = $true; break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ready) { throw 'Packaged demo did not expose three simulated boards' }
            $logs = Invoke-RestMethod 'http://127.0.0.1:18899/api/logs?key=demo-k1' -TimeoutSec 5
            if ($logs.boots.Count -ne 2) { throw 'Packaged demo archives unavailable' }
            $screen = Invoke-RestMethod 'http://127.0.0.1:18899/api/session?key=demo-k1&sid=serial&screen=1' -TimeoutSec 5
            if (-not $screen.terminal_state.managed -or -not $screen.terminal_snapshot.data) {
              throw 'Packaged Node parser/screen snapshot is unavailable'
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seriald-windows
          path: |
            dist/seriald-*-windows-x64-setup.exe
            dist/seriald-*-windows-x64-setup.exe.sha256
            dist/seriald-windows-portable.zip
          if-no-files-found: ignore
