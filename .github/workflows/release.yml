name: Tagged packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            archive_hosts: archive.ubuntu.com security.ubuntu.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version tag
        run: python tools/check_release_tag.py "$GITHUB_REF_NAME"
      - name: Verify Ubuntu archive DNS on the temporary runner
        run: python tools/ci_ubuntu_network.py --repair --hosts ${{ matrix.archive_hosts }}
      - name: Prepare reviewed complete-install inputs
        env:
          DECKLAB_COMPONENTS_URL: ${{ vars.COMPONENTS_LINUX_AMD64_URL || secrets.COMPONENTS_LINUX_AMD64_URL || 'https://github.com/qianqiu-2020/decklab/releases/download/components-1.14.0/decklab-components-1.14.0-linux-amd64.zip' }}
          DECKLAB_COMPONENTS_SHA256: ${{ vars.COMPONENTS_LINUX_AMD64_SHA256 || secrets.COMPONENTS_LINUX_AMD64_SHA256 || '804be4bc200ddefbc99a614e676ba829670100556d6da405bb3597cfb667127c' }}
        run: python tools/fetch_install_components.py --platform linux-amd64
      - name: Freeze the included MCP worker on the native Ubuntu 22.04 baseline
        run: python tools/build_linux_mcp.py --arch '${{ matrix.arch }}' --desktop-runtime build/install-components/linux-amd64/desktop-runtime --output 'build/linux-mcp/${{ matrix.arch }}/runtime'
      - run: python tools/build_deb.py --local-fast --runtime 'build/linux-mcp/${{ matrix.arch }}/runtime' --output dist
      - name: Check fresh installs and upgrades on Ubuntu 22.04 and 24.04 in parallel
        run: |
          curl --fail --location --retry 3 https://github.com/qianqiu-2020/decklab/releases/download/v1.7.0/seriald_1.7.0_all.deb --output build/seriald_1.7.0_all.deb
          echo 'b0020684d469cec4db2fa36f5e967f81c860deb236fbdd1d25da4831857cb1a9  build/seriald_1.7.0_all.deb' | sha256sum --check
          pids=()
          for ubuntu in 22.04 24.04; do
            for mode in fresh upgrade; do
              args=()
              if [[ $mode == upgrade ]]; then args+=(--upgrade-from build/seriald_1.7.0_all.deb); fi
              python tools/test_deb_container.py --image "ubuntu:$ubuntu" --package dist/seriald_*_amd64.deb "${args[@]}" >"build/install-$ubuntu-$mode.log" 2>&1 &
              pids+=("$!")
            done
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          for log in build/install-*.log; do cat "$log"; done
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: seriald-linux-${{ matrix.arch }}
          path: dist/*.deb
          compression-level: 0
  windows:
    uses: ./.github/workflows/windows-portable.yml
    secrets: inherit
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract checked-out release notes
        run: python3 tools/release_notes.py release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: seriald-*
          merge-multiple: true
          path: packages
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd packages
          cp "seriald_${GITHUB_REF_NAME#v}_amd64.deb" seriald_latest_amd64.deb
          # Keep existing x86 download links usable; the package metadata is amd64.
          cp "seriald_${GITHUB_REF_NAME#v}_amd64.deb" seriald_latest_all.deb
          sha256sum "seriald_${GITHUB_REF_NAME#v}_amd64.deb" > linux-SHA256SUMS.txt
          cp "seriald-${GITHUB_REF_NAME#v}-windows-x64-setup.exe" seriald-windows-x64-setup.exe
          sha256sum *.deb *.exe *.zip > SHA256SUMS.txt
          python3 ../tools/verify_release.py . --version "${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --notes-file ../release-notes.md --title "DeckLab $GITHUB_REF_NAME" ./*
