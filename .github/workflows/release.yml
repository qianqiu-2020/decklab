name: Tagged packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        run: python3 tools/check_release_tag.py "$GITHUB_REF_NAME"
      - name: Download the exact commit's accepted packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir packages
          for target in ci.yml:decklab-linux-amd64 windows-installer.yml:decklab-windows; do
            workflow=${target%%:*}
            artifact=${target#*:}
            run_id=$(gh run list --workflow "$workflow" --branch main --commit "$GITHUB_SHA" \
              --status success --limit 10 --json databaseId,event,headSha \
              --jq 'map(select(.event == "push" or .event == "workflow_dispatch"))[0].databaseId // empty')
            test -n "$run_id" || { echo "No accepted $workflow run for $GITHUB_SHA"; exit 1; }
            gh run download "$run_id" --name "$artifact" --dir packages
          done
      - name: Extract checked-out release notes
        run: python3 tools/release_notes.py release-notes.md
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd packages
          cp "decklab_${GITHUB_REF_NAME#v}_amd64.deb" decklab_latest_amd64.deb
          # Keep existing x86 download links usable; the package metadata is amd64.
          cp "decklab_${GITHUB_REF_NAME#v}_amd64.deb" decklab_latest_all.deb
          sha256sum "decklab_${GITHUB_REF_NAME#v}_amd64.deb" > linux-SHA256SUMS.txt
          cp "decklab-${GITHUB_REF_NAME#v}-windows-x64-setup.exe" decklab-windows-x64-setup.exe
          sha256sum *.deb *.exe windows-install-verification.json > SHA256SUMS.txt
          python3 ../tools/verify_release.py . --version "${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --notes-file ../release-notes.md --title "DeckLab $GITHUB_REF_NAME" ./*
