name: Tagged packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version tag
        run: python tools/check_release_tag.py "$GITHUB_REF_NAME"
      - run: python -m pip install 'pyserial>=3.5,<4' 'paramiko>=3.4,<5'
      - run: python -m unittest discover -s tests
      - run: node tests/frontend.test.js && node tests/share.test.js
      - run: python tools/build_deb.py
      - run: sha256sum dist/*.deb > dist/linux-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: seriald-linux
          path: |
            dist/*.deb
            dist/linux-SHA256SUMS.txt
  windows:
    uses: ./.github/workflows/windows-portable.yml
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: seriald-*
          merge-multiple: true
          path: packages
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd packages
          sha256sum *.deb *.exe *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "DeckLab $GITHUB_REF_NAME" ./*
