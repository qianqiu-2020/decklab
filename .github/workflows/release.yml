name: Tagged packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            archive_hosts: archive.ubuntu.com security.ubuntu.com
          - arch: arm64
            runner: ubuntu-22.04-arm
            archive_hosts: ports.ubuntu.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version tag
        run: python tools/check_release_tag.py "$GITHUB_REF_NAME"
      - name: Verify Ubuntu archive DNS on the temporary runner
        run: python tools/ci_ubuntu_network.py --repair --hosts ${{ matrix.archive_hosts }}
      - run: python -m pip install 'pyserial>=3.5,<4' 'paramiko>=3.4,<5'
      - run: python -m pip install -r requirements-mcp.txt
      - name: Install BusyBox for the ash terminal resize regression
        run: |
          if ! command -v busybox >/dev/null; then
            python tools/ci_ubuntu_network.py --repair
            sudo apt-get update -qq
            sudo apt-get install -y busybox
          fi
          busybox ash -c ':'
          busybox stty --help
      - run: python -m unittest discover -s tests
      - run: python tools/check_public_docs.py
      - run: node tests/frontend.test.js && node tests/share.test.js && node tests/image-store.test.js
      - name: Freeze the included MCP worker on the native Ubuntu 22.04 baseline
        run: python tools/build_linux_mcp.py --arch '${{ matrix.arch }}' --output 'build/linux-mcp/${{ matrix.arch }}/runtime'
      - name: Prepare reviewed complete-install inputs
        env:
          DECKLAB_COMPONENTS_URL: ${{ matrix.arch == 'amd64' && secrets.COMPONENTS_LINUX_AMD64_URL || secrets.COMPONENTS_LINUX_ARM64_URL }}
          DECKLAB_COMPONENTS_SHA256: ${{ matrix.arch == 'amd64' && secrets.COMPONENTS_LINUX_AMD64_SHA256 || secrets.COMPONENTS_LINUX_ARM64_SHA256 }}
        run: python tools/fetch_install_components.py --platform 'linux-${{ matrix.arch }}'
      - run: python tools/build_deb.py --runtime 'build/linux-mcp/${{ matrix.arch }}/runtime' --output dist
      - name: Fresh install and public MCP without network on Ubuntu 22.04
        run: python tools/test_deb_container.py --image ubuntu:22.04 --package "dist/seriald_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.deb"
      - name: Fresh install and public MCP without network on Ubuntu 24.04
        run: python tools/test_deb_container.py --image ubuntu:24.04 --package "dist/seriald_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.deb"
      - name: Fetch the checksum-pinned published thin package for upgrade acceptance
        run: |
          curl --fail --location --retry 3 https://github.com/qianqiu-2020/decklab/releases/download/v1.7.0/seriald_1.7.0_all.deb --output build/seriald_1.7.0_all.deb
          echo 'b0020684d469cec4db2fa36f5e967f81c860deb236fbdd1d25da4831857cb1a9  build/seriald_1.7.0_all.deb' | sha256sum --check
      - name: Verify installed Ubuntu 22.04 MCP and upgrade behavior without network
        run: python tools/test_deb_container.py --image ubuntu:22.04 --package "dist/seriald_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.deb" --upgrade-from build/seriald_1.7.0_all.deb
      - name: Verify installed Ubuntu 24.04 MCP and upgrade behavior without network
        run: python tools/test_deb_container.py --image ubuntu:24.04 --package "dist/seriald_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.deb" --upgrade-from build/seriald_1.7.0_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: seriald-linux-${{ matrix.arch }}
          path: dist/*.deb
  windows:
    uses: ./.github/workflows/windows-portable.yml
    secrets: inherit
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract checked-out release notes
        run: python3 tools/release_notes.py release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: seriald-*
          merge-multiple: true
          path: packages
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd packages
          cp "seriald_${GITHUB_REF_NAME#v}_amd64.deb" seriald_latest_amd64.deb
          cp "seriald_${GITHUB_REF_NAME#v}_arm64.deb" seriald_latest_arm64.deb
          # Keep existing x86 download links usable; the package metadata is amd64.
          cp "seriald_${GITHUB_REF_NAME#v}_amd64.deb" seriald_latest_all.deb
          sha256sum "seriald_${GITHUB_REF_NAME#v}_amd64.deb" "seriald_${GITHUB_REF_NAME#v}_arm64.deb" > linux-SHA256SUMS.txt
          cp "seriald-${GITHUB_REF_NAME#v}-windows-x64-setup.exe" seriald-windows-x64-setup.exe
          sha256sum *.deb *.exe *.zip > SHA256SUMS.txt
          python3 ../tools/verify_release.py . --version "${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --notes-file ../release-notes.md --title "DeckLab $GITHUB_REF_NAME" ./*
