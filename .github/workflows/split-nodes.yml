name: Split Web and hardware backend
on:
  workflow_dispatch:
  push:
    paths: ['seriald_core/**', 'seriald_windows.py', 'tests/**', 'tools/test_split_nodes.py', '.github/workflows/split-nodes.yml']
  pull_request:
    paths: ['seriald_core/**', 'seriald_windows.py', 'tests/**', 'tools/test_split_nodes.py', '.github/workflows/split-nodes.yml']
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for native Windows transports
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows.txt
      - name: Authenticated TLS, tasks, artifacts and revocation
        run: python -m unittest discover -s tests -p test_backend_link.py
      - name: Hardware collector exclusion
        run: python -m unittest discover -s tests -p test_collector_lock.py
      - name: Backend URL imports
        run: python -m unittest discover -s tests -p test_image_download.py
      - name: Preinstalled RAM loader validation
        run: python -m unittest discover -s tests -p test_flash_loaders.py
      - name: Real separate role processes, simulated hardware
        run: python tools/test_split_nodes.py
